<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxeyDucks | Partner Pricing Portal</title>
  <style>
    :root {
      color-scheme: light;
      --charcoal: #25231f;
      --cream: #f8f5ef;
      --beige: #d9cbb8;
      --gold: #c7a66a;
      --muted: #c8c0b4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--cream);
      background: var(--charcoal);
      font-family: Arial, Helvetica, sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: 20% 80%;
      min-height: 100vh;
      min-height: 100svh;
    }

    .sidebar {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: clamp(1.25rem, 2.5vw, 2.75rem);
      background: var(--charcoal);
    }

    .wordmark {
      margin: 0 0 clamp(2.5rem, 8vh, 5rem);
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 1.8vw, 1.6rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    h1 {
      margin: 0 0 0.85rem;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.45rem, 2.3vw, 2.1rem);
      font-weight: 400;
      line-height: 1.12;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.76rem, 1vw, 0.92rem);
      line-height: 1.65;
    }

    nav {
      display: flex;
      flex-direction: column;
      margin-top: clamp(1.75rem, 5vh, 3rem);
      border-top: 1px solid rgba(199, 166, 106, 0.55);
    }

    nav a {
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(199, 166, 106, 0.38);
      color: var(--cream);
      font-size: clamp(0.76rem, 1vw, 0.92rem);
      line-height: 1.35;
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: var(--gold);
      transform: translateX(4px);
    }

    nav a:focus-visible {
      outline: 1px solid var(--gold);
      outline-offset: 3px;
    }

    footer {
      margin-top: auto;
      padding-top: 2rem;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
    }

    .hero-image {
      min-width: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: var(--beige);
    }

    .hero-image img {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      object-fit: cover;
      object-position: center;
    }

    @media (max-width: 819px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .hero-image {
        min-height: 42vh;
        min-height: 42svh;
        max-height: 560px;
      }

      .hero-image img {
        height: 42vh;
        height: 42svh;
        max-height: 560px;
      }

      .sidebar {
        padding: 2rem clamp(1.25rem, 6vw, 3rem);
      }

      .wordmark {
        margin-bottom: 2.5rem;
      }

      h1 {
        font-size: clamp(1.8rem, 7vw, 2.4rem);
      }

      .description,
      nav a {
        font-size: 0.95rem;
      }

      nav {
        margin-top: 1.75rem;
      }

      footer {
        margin-top: 2.5rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      nav a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <div class="wordmark">LuxeyDucks</div>
      <h1>Partner Pricing Portal</h1>
      <p class="description">A private source portal for partners to submit pricing to LuxeyDucks. Select a category to begin.</p>
      <nav aria-label="Product categories">
        <a href="loose-diamonds-1-6-carat.html">Loose Diamonds 1–6 Carat</a>
        <a href="bridal.html">Bridal</a>
        <a href="rings.html">Rings</a>
        <a href="necklaces.html">Necklaces</a>
        <a href="earrings.html">Earrings</a>
        <a href="bracelets.html">Bracelets</a>
      </nav>
      <footer>© LuxeyDucks · Private partner portal</footer>
    </aside>
    <section class="hero-image" aria-label="Featured emerald-cut diamond">
      <img src="BE1343_yellow_Emerald_top_3_carat.png" alt="Three-carat yellow emerald-cut diamond" />
    </section>
  </main>
</body>
</html>
