<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LuxeyDucks | My Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3efe9;
      color: #25231f;
    }
    .portal {
      display: grid;
      grid-template-columns: 20% 80%;
      min-height: 100svh;
    }
    .sidebar {
      padding: 42px 24px 24px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-right: 1px solid #eeeae3;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .duck { width: 52px; height: 52px; object-fit: contain; }
    .wordmark {
      font-size: clamp(12px,1.3vw,19px);
      letter-spacing: .19em;
      font-weight: 400;
      margin: 0;
    }
    .subtitle {
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #8c7958;
      margin: 10px 0 0;
    }
    .navigation { margin-top: 52px; }
    .navigation h2 {
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .16em;
      color: #8b8376;
      text-transform: uppercase;
      margin: 0 0 18px;
    }
    .navigation a {
      display: block;
      color: #34312b;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.4;
      padding: 14px 0;
      border-bottom: 1px solid #eeeae3;
    }
    .navigation a:hover,
    .navigation a:focus-visible {
      color: #8c7958;
    }
    .navigation a:focus-visible {
      outline: 2px solid #8c7958;
      outline-offset: 3px;
    }
    .copyright {
      margin-top: auto;
      padding-top: 55px;
      font-size: 9px;
      color: #8b8376;
      line-height: 1.6;
    }
    .content {
      padding: 42px 52px;
    }
    .content-shell {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,.9);
      border: 1px solid #e5dccb;
      padding: 28px 28px 18px;
    }
    .eyebrow {
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #8c7958;
      margin: 0 0 12px;
    }
    h1 {
      margin: 0 0 10px;
      font-family: Georgia, serif;
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 400;
    }
    .intro {
      margin-bottom: 24px;
      color: #5e564e;
      line-height: 1.6;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .field.wide { grid-column: 1 / -1; }
    label {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #7d6d5a;
    }
    input, select {
      width: 100%;
      padding: 12px 10px;
      border: 1px solid #d9d1c4;
      background: #faf8f5;
      color: #2f2b26;
      font: 14px Arial, sans-serif;
    }
    input:focus, select:focus {
      outline: 2px solid #8c7958;
      outline-offset: 2px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px;
    }
    button {
      border: 1px solid #302b25;
      background: #302b25;
      color: #fff;
      padding: 12px 18px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: #302b25;
    }
    .status {
      min-height: 24px;
      margin-top: 14px;
      font-size: 13px;
      color: #2d7357;
    }
    @media (max-width: 760px) {
      .portal { display: block; }
      .sidebar { padding: 24px; }
      .brand { display: flex; gap: 14px; align-items: center; }
      .duck { width: 40px; height: 40px; }
      .content { padding: 24px 18px; }
      .content-shell { padding: 22px 20px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
