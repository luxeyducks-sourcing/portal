.57'},{target:'3.00',range:'2.95–3.11'},{target:'4.00',range:'3.95–4.11'},{target:'5.00',range:'4.95–5.11'},{target:'6.00',range:'5.95–6.11'}];const headers=['Target ct','Acceptable actual ct range','Diamond price per carat (USD)','Certification cost per stone (USD)','Dropship shipping / insurance / handling per order (USD)','Price assumption notes'];const root=document.getElementById('programs');let field=0;function control(kind='input'){const el=document.createElement(kind);el.dataset.save='s-'+field++;return el}for(const shape of shapes){for(const tier of tiers){const section=document.createElement('section');section.className='program';section.innerHTML=`<h2>${shape.name} — ${tier.name}</h2><div class="standard">${shape.standard}</div><div class="tier-specs"><strong>Tier specs:</strong> Color ${tier.color}, Clarity ${tier.clarity}</div><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${weights.map((w,i)=>`<tr><td>${w.target}</td><td>${w.range}</td><td>${control('input').outerHTML}</td><td>${control('input').outerHTML}</td><td>${control('input').outerHTML}</td><td>${control('textarea').outerHTML}</td></tr>`).join('')}</tbody></table></section>`;root.appendChild(section)}}function restore(){const completed=document.documentElement.dataset.completed==='true';document.querySelectorAll('[data-save]').forEach(el=>{el.setAttribute('autocomplete','off');const key='luxey-supply-v9-'+el.dataset.save;if(localStorage.getItem(key)){el.value=localStorage.getItem(key)}el.addEventListener('input',()=>{localStorage.setItem(key,el.value)})})}function downloadCompleted(){const snapshot=document.documentElement.cloneNode(true);snapshot.dataset.completed='true';const originals=document.querySelectorAll('input,textarea');snapshot.querySelectorAll('input,textarea').forEach((el,i)=>{el.value=originals[i].value});const blob=new Blob([snapshot.outerHTML],{type:'text/html'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='luxeyducks-supply-quote-completed.html';a.click();URL.revokeObjectURL(url)}function clearAll(){if(!confirm('Clear every typed partner response on this device?'))return;Object.keys(localStorage).filter(k=>k.startsWith('luxey-supply-v9-')).forEach(k=>localStorage.removeItem(k));location.reload()}restore();</script></body></html>
